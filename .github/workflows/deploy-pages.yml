name: Deploy to GitHub Pages

# Builds the Module Federation remote and publishes dist/ to GitHub Pages, which
# serves it as a CDN: a Flow host loads
#   https://<org>.github.io/flow-sdk-demo/remoteEntry.js
# GitHub Pages sends `Access-Control-Allow-Origin: *`, so cross-origin loading
# by the host works. The page itself renders nothing standalone (headless remote).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version guard diffs against the tip of main before this push,
          # which can be more than one commit back.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The remote entry URL is stable, so the version field is what tells the
      # platform to re-verify. Publishing new bytes under an unchanged version
      # means nothing re-verifies: the platform goes on enforcing the previous
      # bytes' hash against the new ones at the same URL, every host fails its
      # integrity check, and the extension silently stops appearing — no verdict,
      # no finding, nothing in the portal explaining it. Hence a guard, not a
      # convention. A push that touches only documentation passes untouched.
      - name: Refuse to ship changed bytes under an unchanged version
        env:
          # The tip of main before this push. Comparing against HEAD~1 instead
          # refuses a push of two commits whose first one bumped the version.
          # Empty or all zeros on a manual run or a new branch: fall back to HEAD~1.
          BEFORE: ${{ github.event.before }}
        run: |
          BASE=HEAD~1
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          fi
          echo "comparing against $BASE"
          PREV=$(git show "$BASE":package.json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).version}catch(e){''}" || echo "")
          THIS=$(node -p "require('./package.json').version")
          [ -z "$PREV" ] && exit 0
          [ "$PREV" != "$THIS" ] && exit 0
          git diff --quiet "$BASE" HEAD -- src webpack.config.js package.json package-lock.json && exit 0
          echo "::error::Bundle inputs changed but the version is still $THIS. Bump it."
          exit 1

      # zones.manifest.json carries the version the Playwright suite registers the
      # app under. If it drifts from package.json, the suite registers a version
      # the deployed bytes were never published as, and nothing re-verifies.
      - name: Version matches the zone manifest
        run: |
          PKG=$(node -p "require('./package.json').version")
          MAN=$(node -p "require('./src/integration/zones.manifest.json').version")
          [ "$PKG" = "$MAN" ] && exit 0
          echo "::error::package.json is $PKG but zones.manifest.json is $MAN. Bump both."
          exit 1

      - name: Build
        run: npm run build

      # Same seven checks the platform runs on submission — fail here, not there.
      - name: Verify bundle
        run: npm run verify

      # actions/deploy-pages replaces the whole site, so a release would delete
      # the previous releases' hashed chunks while sessions that loaded the old
      # remoteEntry.js still need them. This downloads the last two releases'
      # chunks that dist/ lacks (never overwriting a file) and records this
      # release's list in dist/release-files.json for the next deploy.
      - name: Carry forward the previous releases' chunks
        run: node scripts/carry-forward-chunks.mjs dist "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"

      # Stop Jekyll from stripping webpack's _-prefixed files.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
